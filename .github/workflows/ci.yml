name: Router checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Redis integration test binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends redis-server
          redis-server --version
          redis-cli --version
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run build:vercel
        env:
          ROUTER_PUBLIC_APP_KEY: router_public_ci_build_only
